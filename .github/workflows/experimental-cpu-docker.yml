name: Experimental CPU Docker
on:
  push:
    branches: [develop]
    paths:
      - 'devops/docker-experimental/**'
      - 'src/**'
      - 'modules/ObjectDetectionYOLOv5Net/**'
      - '.github/workflows/experimental-cpu-docker.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: experimental-cpu-docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} -f devops/docker-experimental/Dockerfile -t cpai-experimental:cpu .
      - name: Smoke test server
        run: |
          docker run -d --name cpai-test -p 127.0.0.1:32169:32168 cpai-experimental:cpu
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:32169/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker logs cpai-test || true
      - name: Publish tested image to GHCR
        if: github.ref == 'refs/heads/develop'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag cpai-experimental:cpu "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          docker tag cpai-experimental:cpu "$IMAGE:develop"
          docker push "$IMAGE:develop"
      - name: Export image
        run: docker save cpai-experimental:cpu | gzip > cpai-experimental-cpu.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cpai-experimental-cpu
          path: cpai-experimental-cpu.tar.gz
          retention-days: 7
